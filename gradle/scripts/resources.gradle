String getConfig(String key) {
    return project.properties.get(key)
}

def mod_id = getConfig("mod_id")
def version = getConfig("version")
def mod_license = getConfig("mod_license")
def mod_name = getConfig("mod_name")
def mod_description = getConfig("mod_description")
def mod_url = getConfig("mod_url")
def mod_issue_tracker = getConfig("mod_issue_tracker")

String suffix = System.getenv("VERSION_SUFFIX")
String version_toml = "$version" + (suffix ? "+$suffix" : "")

tasks.register('printVersion') {
    doLast {
        println mod_version
    }
}

// Create run-folders for non-client configs to avoid pollution of dev envs
tasks.matching { it.name.startsWith('prepare') }.configureEach {
    doFirst {
        mkdir('run')
        mkdir('run/server')
        mkdir('run/gametest')
        mkdir('run/data')
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var neoVersion = libs.versions.neoForge.get()
    neoVersion = neoVersion.substring(0, neoVersion.lastIndexOf('.'))
    var replaceProperties = [
            version             : version_toml,
            mod_id              : mod_id,
            minecraft_version   : minecraft_version_range,
            loader_version      : libs.versions.loader.get(),
            neo_version         : neoVersion,
            mod_license         : mod_license,
            mod_name            : mod_name,
            mod_description     : mod_description,
            mod_url             : mod_url,
            mod_issue_tracker   : mod_issue_tracker
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Set custom duplicates strategy for processResources task
tasks.named('processResources').configure {
    // 默认策略：保留第一个遇到的文件（跳过重复）
    duplicatesStrategy = 'EXCLUDE'
    // 对lang文件使用不同的策略：让生成目录的文件覆盖主资源目录
    eachFile { file ->
        if (file.path.contains('/lang/') || file.name.endsWith('.json') && file.path.contains('lang')) {
            // 对于lang文件，设置为INCLUDE以便后续处理
            // 实际覆盖通过目录顺序实现
        }
    }
}